name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      - name: Compiler version
        run: nix develop .#ci --command c++ --version

      - name: Configure
        run: nix develop .#ci --command cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: nix develop .#ci --command cmake --build build --parallel

      - name: Test
        run: nix develop .#ci --command ctest --test-dir build --output-on-failure
